data:
  delta_t_seconds: 5
  window_overlap: 0.0
  history_windows: 12
  horizon_5_windows: 1
  horizon_30_windows: 6
  horizon_60_windows: 12

model:
  flow_input_dim: 28
  packet_input_dim: 12
  branch_dim: 32
  fused_dim: 64
  hidden_dim: 64

training:
  epochs: 40
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 7
  gradient_clip_norm: 1.0
  seed: 42

loss:
  state_weight: 0.3
  attack_weight: 1.0
  stage_weight: 0.5

thresholding:
  target_validation_fpr: 0.05

paths:
  cic2017_csv_dir: data/raw/cic2017/csv
  cic2017_pcap: data/raw/cic2017/pcap/Wednesday-workingHours.pcap
  ctu13_dir: data/raw/ctu13
  processed_dir: data/processed/cic2017
  checkpoint_dir: checkpoints
  metrics_dir: metrics
  mitre_mapping: mitre_mapping/attack_stage_mapping.json
